<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>兼松祐明 AR名刺</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html, body { margin:0; padding:0; overflow:hidden; font-family: sans-serif; background:#123620; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             background:rgba(18,54,32,.96); color:#fff; z-index:10; text-align:center; padding:24px; box-sizing:border-box; }
  .overlay.hidden { display:none; }
  .overlay img { width:150px; border-radius:8px; border:3px solid #faf7ee; }
  .overlay h1 { font-size:22px; margin:16px 0 6px; }
  .overlay p { font-size:14px; line-height:1.7; margin:4px 0; opacity:.92; }
  button, .btn { border:none; border-radius:999px; padding:16px 34px; font-size:18px; font-weight:bold; cursor:pointer; text-decoration:none; }
  #startBtn { background:#06C755; color:#fff; margin-top:18px; }
  #scanHint { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:5;
              background:rgba(0,0,0,.65); color:#fff; padding:10px 18px; border-radius:999px; font-size:14px; white-space:nowrap; }
  #scanHint.hidden { display:none; }
  #tapPlay { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); z-index:6;
             background:#06C755; color:#fff; box-shadow:0 4px 18px rgba(0,0,0,.4); }
  #tapPlay.hidden { display:none; }
  #domvid { position:fixed; left:50%; top:44%; transform:translate(-50%,-50%); z-index:4;
            width:min(80vw, 46vh); border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,.5); background:#000; }
  #domvid.hidden { display:none; }
  #endUI { background:rgba(0,0,0,.55); }
  #lineBtn { background:#06C755; color:#fff; display:inline-block; margin-top:10px; }
  #replayBtn { background:#fff; color:#123620; margin-top:14px; font-size:15px; padding:12px 26px; }
</style>
</head>
<body>

<div id="landing" class="overlay">
  <img src="./assets/trigger.jpg" alt="AR名刺の表面">
  <h1>兼松 祐明</h1>
  <p>カメラを許可して、名刺の「表」の<br>ねこにかざしてください。</p>
  <button id="startBtn">カメラを起動する</button>
  <p style="font-size:12px; opacity:.7;">動画が終わると LINE ボタンが出ます</p>
</div>

<div id="scanHint" class="hidden">📷 名刺の表（ねこ）にかざしてね</div>
<button id="tapPlay" class="hidden">▶ 動画を再生する</button>
<video id="domvid" class="hidden" src="./assets/cat.mp4" preload="auto" playsinline webkit-playsinline muted></video>

<div id="endUI" class="overlay hidden">
  <h1>ありがとうございました！</h1>
  <p>よければ LINE でつながってください</p>
  <a id="lineBtn" class="btn" href="https://line.me/ti/p/3i4ATQizVX">LINEでつながる</a>
  <button id="replayBtn">もう一度みる</button>
</div>

<a-scene id="scene"
  mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no"
  color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-assets>
    <video id="catvid" src="./assets/cat.mp4" preload="auto" playsinline webkit-playsinline muted loop="false" crossorigin="anonymous"></video>
  </a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <!-- video plane covers the cat photo area of the card front:
         photo region x 70..1230, y 70..1617 on a 1300x2150 canvas
         -> width 0.892, height 1.190, center y +0.178 -->
    <a-video id="arplane" src="#catvid" width="0.892" height="1.190" position="0 0.178 0.001"></a-video>
  </a-entity>
</a-scene>

<script>
  const LINE_URL = "https://line.me/ti/p/3i4ATQizVX";
  document.getElementById('lineBtn').href = LINE_URL;

  // iOS Safari cannot reliably render the WebGL video texture used by the
  // AR plane, so on iOS the video is shown as a normal DOM <video> overlay
  // on top of the camera view instead. Tracking (targetFound/Lost) is the same.
  const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
                 (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  const sceneEl = document.getElementById('scene');
  const video = document.getElementById('catvid');   // texture video (non-iOS)
  const domvid = document.getElementById('domvid');  // overlay video (iOS)
  const landing = document.getElementById('landing');
  const scanHint = document.getElementById('scanHint');
  const endUI = document.getElementById('endUI');
  const tapPlay = document.getElementById('tapPlay');
  const activeVideo = () => IS_IOS ? domvid : video;

  if (IS_IOS) {
    document.getElementById('arplane').setAttribute('visible', 'false');
  }

  function tryPlay(v) {
    v.muted = true;
    const p = v.play();
    if (p && p.catch) p.catch(() => { try { v.load(); } catch(e) {} v.play().catch(() => {}); });
  }

  function checkFallback(v) {
    setTimeout(() => {
      if (!v.ended && (v.paused || v.currentTime < 0.05)) {
        tapPlay.classList.remove('hidden');
      }
    }, 900);
  }

  document.getElementById('startBtn').addEventListener('click', async () => {
    landing.classList.add('hidden');
    scanHint.classList.remove('hidden');
    // prime the active video inside the user gesture (unlock for iOS)
    const v = activeVideo();
    try { v.muted = true; await v.play(); v.pause(); v.currentTime = 0; } catch(e) {}
    sceneEl.systems['mindar-image-system'].start();
  });

  const targetEl = document.getElementById('target');
  targetEl.addEventListener('targetFound', () => {
    scanHint.classList.add('hidden');
    endUI.classList.add('hidden');
    tapPlay.classList.add('hidden');
    const v = activeVideo();
    if (IS_IOS) domvid.classList.remove('hidden');
    if (v.ended) v.currentTime = 0;
    tryPlay(v);
    checkFallback(v);
  });
  targetEl.addEventListener('targetLost', () => {
    const v = activeVideo();
    v.pause();
    if (IS_IOS) domvid.classList.add('hidden');
    tapPlay.classList.add('hidden');
    if (!v.ended) scanHint.classList.remove('hidden');
  });

  tapPlay.addEventListener('click', () => {
    tapPlay.classList.add('hidden');
    const v = activeVideo();
    if (v.ended) v.currentTime = 0;
    if (IS_IOS) domvid.classList.remove('hidden');
    const p = v.play();
    if (p && p.catch) p.catch(() => tryPlay(v));
  });

  function onEnded() {
    if (IS_IOS) domvid.classList.add('hidden');
    tapPlay.classList.add('hidden');
    endUI.classList.remove('hidden');
  }
  video.addEventListener('ended', () => { if (!IS_IOS) onEnded(); });
  domvid.addEventListener('ended', () => { if (IS_IOS) onEnded(); });

  document.getElementById('replayBtn').addEventListener('click', () => {
    endUI.classList.add('hidden');
    const v = activeVideo();
    v.currentTime = 0;
    if (IS_IOS) domvid.classList.remove('hidden');
    // user gesture: playback always allowed here
    const p = v.play();
    if (p && p.catch) p.catch(() => tryPlay(v));
  });
</script>
</body>
</html>
